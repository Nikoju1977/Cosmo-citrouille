name: Publier Cosmo Citrouille sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - icon-art.svg
      - manifest.webmanifest
      - service-worker.js
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer les fichiers
        uses: actions/checkout@v4
      - name: Preparer le jeu statique
        run: |
          mkdir -p _site
          cp index.html icon-art.svg manifest.webmanifest service-worker.js .nojekyll _site/
      - name: Televerser le jeu
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
